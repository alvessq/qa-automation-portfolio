name: Mobile E2E (Android)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: O que executar
        type: choice
        default: smoke
        options: [smoke, regression, spec]
      specName:
        description: Spec usada quando suite = spec
        type: choice
        default: login
        options: [catalog, login, product-details, cart, checkout, logout]
  push:
    branches: [main]
    paths:
      - 'apps/mobile-e2e/**'
      - '.github/workflows/mobile-e2e.yml'
      - '.github/scripts/run-mobile-suite.sh'
  schedule:
    - cron: '0 12 * * 1' # segunda-feira, 09h (America/Sao_Paulo): regressão semanal

permissions:
  contents: read

concurrency:
  group: mobile-e2e
  cancel-in-progress: false

jobs:
  android:
    name: Android API 34 · ${{ inputs.suite == 'spec' && inputs.specName || inputs.suite || (github.event_name == 'schedule' && 'regression') || 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      API_LEVEL: 34
      ANDROID_DEVICE_NAME: emulator-5554
      ANDROID_UDID: emulator-5554
      # Emulador da CI não tem GPU: gravação de tela pesa e pode travar o adb.
      RECORD_VIDEO: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Habilitar KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolver suíte
        id: suite
        env:
          SUITE: ${{ inputs.suite || (github.event_name == 'schedule' && 'regression') || 'smoke' }}
          SPEC_NAME: ${{ inputs.specName }}
        run: |
          case "$SUITE" in
            smoke|regression) target="$SUITE" ;;
            spec) target="spec:${SPEC_NAME:-login}" ;;
            *) echo "::error::suite inválida: $SUITE"; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Cache do driver Appium
        uses: actions/cache@v4
        with:
          path: apps/mobile-e2e/.appium
          key: appium-uia2-${{ hashFiles('package-lock.json') }}

      - name: Instalar driver UiAutomator2
        run: npm run appium:setup -w mobile-e2e

      - name: Baixar APK do My Demo App
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run apk:download -w mobile-e2e

      - name: Cache do AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-pixel6-v1

      - name: Criar snapshot do AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD criado e salvo em cache."

      - name: Executar ${{ steps.suite.outputs.target }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-mobile-suite.sh "${{ steps.suite.outputs.target }}"

      - name: Publicar evidências
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-${{ github.run_id }}
          path: apps/mobile-e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
